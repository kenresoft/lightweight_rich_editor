name: lightweight_rich_editor
description: "A rich-text editor for Flutter that draws notes on ruled paper. Lists, code blocks, pictures, links, find and replace, HTML and Markdown paste."
version: 0.3.1
repository: https://github.com/kenresoft/lightweight_rich_editor
issue_tracker: https://github.com/kenresoft/lightweight_rich_editor/issues
topics:
  - editor
  - rich-text
  - text
  - notebook
  - performance

screenshots:
  - description: 'Bold, italic, inline code, colour, highlight, a larger size and a picture on ruled paper.'
    path: screenshots/01-page.png
  - description: 'A selected picture with its size bar.'
    path: screenshots/02-picture.png
  - description: 'Checklist, numbered list, a syntax-coloured code block and the link bar.'
    path: screenshots/03-code-link.png
  - description: 'Find with the current match highlighted.'
    path: screenshots/04-find.png
  - description: 'The same note in dark mode.'
    path: screenshots/05-dark.png

environment:
  sdk: ^3.12.1
  flutter: ">=3.0.0"

dependencies:
  html: ^0.15.7
  url_launcher: ^6.3.3
  web: ^1.1.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        package: com.kenresoft.lightweight_rich_editor
        pluginClass: LightweightRichEditorPlugin
      ios:
        pluginClass: LightweightRichEditorPlugin
      web:
        pluginClass: LightweightRichEditorWeb
        fileName: src/clipboard/native/rich_clipboard_web.dart
      macos:
        pluginClass: LightweightRichEditorPlugin
      windows:
        pluginClass: LightweightRichEditorPlugin
      linux:
        pluginClass: LightweightRichEditorPlugin

  uses-material-design: true
